<app-section-wrapper sectionId="certifications">
  <span class="section-label">Credentials</span>
  <h2 class="section-title">Certifications</h2>

  <div class="certs-grid">
    @for (cert of certifications; track cert.name) {
      <div class="cert-item stagger-child">
        <div class="cert-dot"></div>
        <div class="cert-info">
          <div class="cert-name">{{ cert.name }}</div>
          <div class="cert-meta">{{ cert.issuer }} · {{ cert.date }}</div>
        </div>
      </div>
    }
  </div>
</app-section-wrapper>
